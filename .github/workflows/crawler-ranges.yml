name: Crawler IP Ranges

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: crawler-ranges
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Deps
        run: SENTRYCLI_SKIP_DOWNLOAD=1 pnpm install

      - name: Refresh ranges
        run: node scripts/fetch-crawler-ranges.mjs

      - name: Verify the snapshot still parses
        run: npx vitest run src/middlewares src/__tests__/api-isBot.test.ts

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CRAWLER_RANGES_TOKEN || secrets.GITHUB_TOKEN }}
          branch: chore/crawler-ranges
          base: master
          title: 'chore(middleware): refresh crawler IP ranges'
          commit-message: 'chore(middleware): refresh crawler IP ranges'
          body: |
            Refreshes the published crawler IP range snapshot used to verify
            GPTBot and DuckDuckBot.

            - Generated by scripts/fetch-crawler-ranges.mjs; review the prefix
              counts rather than every line.
          labels: dependencies
          delete-branch: true
